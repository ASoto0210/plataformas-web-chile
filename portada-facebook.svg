<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312" role="img" aria-label="Portada Facebook — Plataformas Web Chile">
  <title>Plataformas Web Chile — portada de Facebook (820×312)</title>
  <defs>
    <linearGradient id="topPlate" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#2CE4C4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="82%" cy="0%" r="60%">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.35"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="2%" cy="105%" r="55%">
      <stop offset="0" stop-color="#2CE4C4" stop-opacity="0.20"/><stop offset="1" stop-color="#2CE4C4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#EAF0FA" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="820" height="312" fill="#0B1220"/>
  <rect width="820" height="312" fill="url(#grid)"/>
  <rect width="820" height="312" fill="url(#glowA)"/>
  <rect width="820" height="312" fill="url(#glowB)"/>

  <!-- símbolo -->
  <g transform="translate(232,90) scale(1.32)">
    <rect x="16" y="60" width="68" height="15" rx="4.5" fill="#2F6BFF"/>
    <rect x="24" y="42" width="52" height="15" rx="4.5" fill="#5B8CFF"/>
    <rect x="32" y="24" width="36" height="15" rx="4.5" fill="url(#topPlate)"/>
  </g>

  <!-- wordmark -->
  <text x="410" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#EAF0FA">Plataformas<tspan fill="#8A97AD" font-weight="400"> Web</tspan></text>
  <text x="410" y="188" text-anchor="middle" font-family="Consolas, ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="500" letter-spacing="6" fill="#2CE4C4">CHILE · DESARROLLO WEB</text>
  <text x="410" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#8A97AD">Sitios, tiendas online y sistemas a medida</text>
  <text x="410" y="268" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="13" letter-spacing="1.5" fill="#5B8CFF">@plataformasweb.chile</text>
</svg>
